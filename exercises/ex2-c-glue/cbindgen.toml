# cbindgen configuration for Exercise 2 — deliberately almost empty.
# Regenerate the header with:
#     cbindgen --output include/ex2_c_glue.h
# build-and-test.sh does that for you.
#
# Everything not set here is cbindgen's default. The point of the exercise is
# that the tool reads your `extern "C"` signatures and writes the header you
# would otherwise have written by hand — not that the config is interesting.
language = "C"
include_guard = "EX2_C_GLUE_H"
# Carry your Rust doc comments into the header, so whatever you decide the
# error convention is ends up documented where C callers actually read it.
documentation = true

autogen_warning = "/* Auto-generated by cbindgen — regenerate with `cbindgen --output include/ex2_c_glue.h`. */"
