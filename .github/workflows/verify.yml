# Verifier — thin caller over verify/verify.sh.
#
# The script is the seam: CI calls it, the justfile will call it, and the
# future CLI replaces it behind the same argv interface. This workflow only
# provisions toolchains and fans out over what `verify.sh discover` reports,
# so it is branch-agnostic: on a branch with no step*/ dirs every job skips
# and the run is trivially green; merged into steps/solutions/any work
# branch, it verifies what's there.
#
# Toolchain pins (kotlinc release zip, JNA version + checksum) are inherited
# from the private development repo (alycda/aoc-ffi-workshop) ci.yml.

name: Verify

on:
  push:
  pull_request:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo and runs tests. It also
# executes externally-fetched toolchains (kotlinc, JNA) and repo-controlled
# shell, so the token it hands that chain is read-only.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  discover:
    name: discover step dirs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.d.outputs.crates }}
      python: ${{ steps.d.outputs.python }}
      kotlin: ${{ steps.d.outputs.kotlin }}
      swift: ${{ steps.d.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      # The seam's own classification logic is load-bearing and otherwise only
      # exercised against whatever steps happen to exist — test it directly.
      - name: Self-test the verifier's classification
        run: verify/tests/discover_test.sh
      - id: d
        run: |
          found=$(verify/verify.sh discover)
          echo "discovered: $found"
          echo "crates=$(echo "$found" | jq -c .crates)" >> "$GITHUB_OUTPUT"
          echo "python=$(echo "$found" | jq -c .python)" >> "$GITHUB_OUTPUT"
          echo "kotlin=$(echo "$found" | jq -c .kotlin)" >> "$GITHUB_OUTPUT"
          echo "swift=$(echo "$found" | jq -c .swift)" >> "$GITHUB_OUTPUT"

  crates:
    name: crate ${{ matrix.dir }} / ${{ matrix.os }}
    needs: discover
    if: needs.discover.outputs.crates != '[]'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.crates) }}
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      # matrix.dir reaches the shell via env, never textual interpolation into
      # the run script — a crafted step-dir name can't inject commands.
      - run: verify/verify.sh crate "$DIR"
        env:
          DIR: ${{ matrix.dir }}

  python:
    name: python ${{ matrix.dir }} / ${{ matrix.os }}
    needs: discover
    if: needs.discover.outputs.python != '[]'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.python) }}
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      - run: verify/verify.sh python "$DIR"
        env:
          DIR: ${{ matrix.dir }}

  kotlin:
    name: kotlin ${{ matrix.dir }} / ubuntu
    needs: discover
    if: needs.discover.outputs.kotlin != '[]'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.kotlin) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOTLIN_VERSION: 2.0.21
      KOTLIN_SHA256: 0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
      JNA_VERSION: 5.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Pinned compiler zip over snap (can't pin) or sdkman (extra layer):
      # self-contained dist that only needs the JVM above.
      - name: Install kotlinc (pinned release zip)
        run: |
          curl -fsSL -o /tmp/kotlin-compiler.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          # A replaced release asset can't slip through: verify before we run it.
          echo "${KOTLIN_SHA256}  /tmp/kotlin-compiler.zip" | sha256sum -c -
          unzip -q /tmp/kotlin-compiler.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          "$HOME/kotlin/kotlinc/bin/kotlinc" -version
      - run: verify/verify.sh kotlin "$DIR"
        env:
          DIR: ${{ matrix.dir }}

  book:
    name: book builds (no broken includes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # mdbook exits 0 even on a broken {{#include}} (ERROR to stderr, HTML still
      # written), and pages.yml only builds on main — so without this, a broken
      # include (e.g. a renamed step0-setup/) would merge silently. Fail on ERROR.
      - name: mdbook build, failing on any ERROR
        run: |
          cargo install mdbook --version ^0.4 --locked
          cd book
          mdbook build 2>build.log || { cat build.log; exit 1; }
          if grep -qE '^[[:space:]]*ERROR' build.log; then
            echo "mdbook emitted ERROR (broken include or missing page):"; cat build.log; exit 1
          fi

  swift:
    name: swift ${{ matrix.dir }} / macos
    needs: discover
    if: needs.discover.outputs.swift != '[]'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.swift) }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      - run: verify/verify.sh swift "$DIR"
        env:
          DIR: ${{ matrix.dir }}
