name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prebuilt binaries: `cargo install` here compiled both from source
      # (~5-10 min per push); install-action downloads releases in seconds
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook,just

      - name: "mdbook"
        run: just _build-book-gha
      
      # OPTIONAL: Replace the above with one of these for your project:
      #
      # Rust docs:
      #   - run: cargo doc --no-deps
      #   - run: mv target/doc _site
      #        

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
