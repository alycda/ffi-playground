# Swift track CI (exercises/ex3-bindings/swift/).
#
# Same rule as python.yml: the exercise is unfinished on purpose, so this
# never tests that Exercise 3 passes. It tests the pristine-state contract —
# everything the attendee did NOT write must already work, so a fresh
# checkout fails exactly where it is supposed to:
#
#   1. the Ex 2 header GENERATES — it is gitignored by design (the attendee
#      produces it in step 3 of Exercise 2), so this job runs cbindgen the
#      way build-and-test.sh does and proves the machinery works on a
#      machine nobody provisioned by hand;
#   2. the documented swiftc command compiles pristine main.swift against
#      that generated header — the real assertion of this workflow: cbindgen
#      output must stay importable as an ObjC bridging header, todo!() and
#      all;
#   3. the compiled binary runs and exits 1 at "TODO 2 not done yet" — the
#      loader found the cdylib, so the -L / DYLD_LIBRARY_PATH story the
#      header documents still holds.
#
# macOS only, deliberately. The Swift track's Linux story is the nixpkgs
# runtime dance (SWIFT_RT, libdispatch.so) that main.swift's own header
# walks through — a GitHub runner has no nix profile, so exercising it here
# would validate a machine no attendee has. macos-latest ships a runnable
# swiftc, which is also where nearly every Swift-track attendee sits.

name: Swift track

on:
  push:
  pull_request:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo and runs the track.
permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pristine:
    name: pristine / macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary for the same reason pages.yml gives: `cargo install
      # cbindgen` compiles it from source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exercises
      # --locked for the same reason as rust.yml: exercises/Cargo.lock is
      # what pins the attendee's build, so it must be committed and current.
      - run: cargo build --release --locked -p ex2-c-glue
        working-directory: exercises
      # Steps 1 and 2 of build-and-test.sh, minus the C harness — the
      # header is machine output the attendee generates, so CI generates it
      # the same way rather than committing a copy the .gitignore exists to
      # keep out.
      - name: generate the Ex 2 header
        working-directory: exercises/ex2-c-glue
        run: cbindgen --output include/ex2_c_glue.h
      # The exact compile command main.swift documents. This line failing is
      # the workflow's reason to exist: it means cbindgen's output stopped
      # being importable from Swift.
      - name: compile pristine main.swift against the generated header
        working-directory: exercises/ex3-bindings/swift
        run: |
          swiftc main.swift \
              -import-objc-header ../../ex2-c-glue/include/ex2_c_glue.h \
              -L ../../target/release -lex2_c_glue -o ex3
      # SWIFT_RT is empty on macOS — the macOS toolchain carries its own
      # runtime — so the documented run line reduces to the library path.
      - name: pristine ex3 fails at TODO 2, not earlier
        working-directory: exercises/ex3-bindings/swift
        run: |
          export DYLD_LIBRARY_PATH=../../target/release
          status=0
          out=$(./ex3 2>&1) || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::pristine ex3 exited 0 — the exercise can pass before the attendee wrote anything'
            exit 1
          fi
          case "$out" in
            *'TODO 2 not done yet'*) ;;
            *) echo '::error::pristine ex3 failed before TODO 2 — the compile or the loader path regressed'
               exit 1 ;;
          esac
